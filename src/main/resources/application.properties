# Application Configuration
spring.application.name=tutors-be
server.port=${PORT:8080}

# Database Configuration (Defaults to H2 in-memory DB for local testing; can be overridden by DB_URL for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:giasuhq;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Import optional local properties (git-ignored for development secrets)
spring.config.import=optional:classpath:application-local.properties

# CORS Configuration for React Frontend
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

