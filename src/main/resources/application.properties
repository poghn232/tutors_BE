# Application Configuration
spring.application.name=tutors-be
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Supports local & Supabase environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/giasuhq}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration for React Frontend
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
