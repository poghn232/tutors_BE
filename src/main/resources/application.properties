# Application Configuration
spring.application.name=tutors-be
server.port=${PORT:8080}

# Database Configuration (MySQL Cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Script Initialization
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Import optional local properties and .env file (git-ignored for development secrets)
spring.config.import=optional:file:./.env,optional:classpath:application-local.properties

# CORS Configuration for React Frontend
app.cors.allowed-origins=${CORS_ORIGINS}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

