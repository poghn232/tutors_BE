# Application Configuration
spring.application.name=tutors-be
server.port=${PORT:8080}

# Multipart File Upload Settings
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.resolve-lazily=true


# Database Configuration (MySQL Cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Script Initialization (never drop or wipe tables on redeploy)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# Import optional local properties and .env file (git-ignored for development secrets)
spring.config.import=optional:file:./.env,optional:classpath:application-local.properties

# CORS Configuration for React Frontend
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# VNPay Payment Gateway Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE:6NQ5V6GO}
vnpay.hash-secret=${VNPAY_HASH_SECRET:UBSXLCRDVNJYZBIFXYMTQTCFHRYJAAOS}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:https://tutors-fe.vercel.app/#payment-result}

# Email delivery configuration. Use SMTP locally or Resend HTTP API on Render Free.
mail.provider=${MAIL_PROVIDER:smtp}
mail.http.timeout=${MAIL_HTTP_TIMEOUT:10000}
resend.api.url=${RESEND_API_URL:https://api.resend.com/emails}
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:giasuhq.contact@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

